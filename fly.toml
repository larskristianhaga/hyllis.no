# Web app (HTMX pages + Supabase login). Holds no database/Redis/Google
# Books credentials — all data goes through the API app (fly.api.toml),
# reached over Fly's private network via Flycast.
app = 'hyllis'
primary_region = 'ams'

[processes]
  app = 'run-app web'

[env]
  PORT = '8080'
  API_URL = 'http://hyllis-api.flycast'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
