{{define "book-card"}}
<a class="book-card" href="/books/{{.ID}}">
  {{if .CoverURL}}
  <div class="book-card__cover">
    <img src="{{.CoverURL}}" alt="Omslag til {{.Title}}" loading="lazy">
  </div>
  {{else}}
  <div class="book-card__cover" aria-hidden="true">{{initial .Title}}</div>
  {{end}}
  <div class="book-card__body">
    <h3 class="book-card__title">{{.Title}}</h3>
    <p class="book-card__author">{{.Author}}</p>
    <p class="book-card__isbn">ISBN {{.ISBN}}</p>
  </div>
</a>
{{end}}
