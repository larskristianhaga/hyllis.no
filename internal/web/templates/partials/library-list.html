{{define "library-list"}}
<section class="library">
  <h1>Bibliotek</h1>
  <form
    class="library__search"
    role="search"
    hx-get="/books/search"
    hx-target="#library-results"
    hx-swap="innerHTML"
    hx-trigger="keyup changed delay:300ms from:input[name='q'], search from:input[name='q'], change from:select[name='field']">
    <label for="library-search-input">Søk i biblioteket</label>
    <input
      id="library-search-input"
      type="search"
      name="q"
      placeholder="Søk på tittel, forfatter eller forlag"
      autocomplete="off">

    <!--
      This select is a display-only visibility filter — it narrows which of
      the already-(fuzzy-)matched books above are shown, based on whether
      they have something set in the chosen field. It has no effect on what
      "q" matches against; see handlers.filterBooks/passesFieldFilter.
    -->
    <label for="library-search-field">Vis kun bøker med</label>
    <select id="library-search-field" name="field">
      <option value="all">Alle treff</option>
      <option value="title">Registrert tittel</option>
      <option value="author">Registrert forfatter</option>
      <option value="publisher">Registrert forlag</option>
    </select>
  </form>
  <div id="library-results">
    {{template "search-results" .}}
  </div>
</section>
{{end}}
